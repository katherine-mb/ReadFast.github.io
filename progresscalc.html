<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Progress Calculator Page | ReadFast</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
        <link href="./css/styles.css" rel="stylesheet">
        <script src="./js/main.js" defer></script>
        <script src="./js/progresscalc.js" defer></script>
    </head>
    <body>
        <header id="header-placeholder"></header>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <main>
            <section class="py-5 text-center">
                <div class="container" aria-labelledby="progress-calc-title">
                    <h1 id="progress-calc-title" class="fw-bolder text-center mb-4">Progress Calculator</h1>
                    <p class="fw-standard lead">Find out how many pages a day you need you read in order to finish your book in the desired time!</p>
                </div>
            </section>
            
            
            <section class="py-5 text-center">
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-md-8 col-lg-5">
                            <h1 class="h3 fw-bold text-center mb-4">Progress Calculator</h1>

                            <div class="card">
                                <div class="card-body">
                                    <form id="calc-form">
                                        <div class="mb-3">
                                            <label class="form-label" for="calc-pages">Pages in Book</label>
                                            <input type="number" class="form-control" id="calc-pages" required>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label" for="calc-days">Days to Finish</label>
                                            <input type="number" class="form-control" id="calc-days" required>
                                        </div>
                                        <div class="d-flex justify-content-center gap-2">
                                            <button type="submit" class="btn btn-lg fw-bold theme-accent">Calculate</button>
                                            <button type="button" class="btn btn-lg fw-bold text-danger" id="calc-reset">Reset</button>
                                        </div>
                                    </form>

                                    <div id="calc-result" class="alert text-center mt-4 mb-0 d-none" role="status" aria-live="polite"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

    </body>
</html>
