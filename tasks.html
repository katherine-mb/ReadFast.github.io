<!DOCTYPE html>
<html lang = "en" data-bs-theme = "light">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width = device-width, initial-scale = 1">

        <title>Book Management Page | ReadFast</title>

        <link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel = "stylesheet">
        <link rel = "stylesheet" href = "https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
        <link href = "./css/styles.css" rel = "stylesheet">
        <script src = "./js/main.js" defer></script>
        <script src = "./js/tasks.js" defer></script>
    </head>
    <body>
        <header id = "header-placeholder"></header>
        <script src = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <main>
            <section class = "py-5 text-center" aria-labelledby = "form-start">
                <div class = "container col-lg-8 justify-content-center">

                    <div class = "container py-4 col-lg-12 justify-content-center">
                        <div class = "table-responsive">

                            <table class = "table align-middle">
                                <td>
                                    <div class = "col-6">
                                        <div class = "card text-center">
                                            <div class = "class-body">
                                                <div class = "small text-muted">Total</div>
                                                <div class = "fs-3" id = "count-total">0</div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class = "col-6">
                                        <div class = "card text-center">
                                            <div class = "card-body">
                                                <div class = "small text-muted">Pending</div>
                                                <div class = "fs-3" id = "count-pending">0</div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class = "col-6">
                                        <div class = "card text-center">
                                            <div class = "card-body">
                                                <div class = "small text-muted">Completed</div>
                                                <div class = "fs-3" id = "count-completed">0</div>
                                            </div>
                                        </div>
                                    </div>
                                </td>

                                <td>
                                    <div class = "card">
                                        <div class = "card-body">
                                            <h2 class = "h5 fw-bold" id = "form-heading">Add Book</h2>
                                            <form id = "task-form">
                                                <div class = "mb-3">
                                                    <label class = "form-label" for = "book-title">Book name</label>
                                                    <input type = "text" class = "form-control" id = "book-title" required>
                                                </div>
                                                <div class = "mb-3">
                                                    <label class = "form-label" for = "task-desc">Task</label>
                                                    <textarea class = "form-control" id = "task-desc" rows = "3" required></textarea>
                                                </div>
                                                <div class = "mb-3">
                                                    <label class = "form-label" for = "task-due">Due date</label>
                                                    <input type = "date" class = "form-control" id = "task-due" required>
                                                </div>
                                                <div class = "mb-3">
                                                    <label class = "form-label" for = "task-status">Status</label>
                                                    <select class = "form-select" id = "task-status">
                                                        <option>Read</option><option selected>Currently Reading</option><option>Want to Read</option>
                                                    </select>
                                                </div>
                                                <button type = "submit" class = "btn btn-lg fw-bold theme-accent" id = "submit-btn">Add Task</button>
                                                <button type = "button" class = "btn btn-lg fw-bold text-danger" id = "cancel-btn">Cancel</button>
                                            </form>
                                        </div>
                                    </div>
                                </td>
                            </table>

                        </div>
                    </div>
                </div>

                <div class = "container py-4 col-lg-8 justify-content-center">
                    <table class = "table align-middle">
                        <tr>
                            <th>Sort</th>
                            <th>Filter</th>
                            <th>Search</th>
                        </tr>
                        <td>
                            <div class = "col-md-12">
                                <select class = "form-select" id = "sort-by" aria-label = "Sort tasks">
                                <option value = "added">Date added</option>
                                <option value = "due-asc">Due date (soonest first)</option>
                                <option value = "due-desc">Due date (latest first)</option>
                                <option value = "name-asc">Name (A-Z)</option>
                                <option value = "name-desc">Name (Z-A)</option>
                                </select>
                            </div>
                        </td>
                        <td>
                            <div class = "col-md-12">
                                <select class = "form-select" id = "filter-status" aria-label = "Filter by status">
                                <option value = "all">All</option>
                                <option value = "pending">Pending</option>
                                <option value = "completed">Completed</option>
                                </select>
                            </div>
                        </td>
                        <td>
                            <div class = "col-md-12 py-2">
                                <input type = "search" class = "form-control" id = "search-input"
                                    placeholder = "Search by book or description..." aria-label = "Search tasks">
                            </div>
                        </td>
                    </table>

                    <div class = "table-responsive">
                        <table class = "table table-hover align-middle">
                            <thead class = "table-light">
                                <tr>
                                    <th>Book</th>
                                    <th>Description</th>
                                    <th>Due</th>
                                    <th>Status</th>
                                    <th>Completed</th>
                                    <th>Edit</th>
                                </tr>
                            </thead>
                            <tbody id = "task-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
        <footer id = "footer-placeholder"></footer>
    </body>
</html>
